name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npx expo prebuild --platform android --non-interactive
      - name: Bundle JavaScript into the standalone debug APK
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          assert 'react {' in s, 'React Native Gradle configuration missing'
          p.write_text(s.replace('react {', 'react {\n    debuggableVariants = []', 1))
          PYTHON
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-elite-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
